# Random I/O Benchmark Configuration
# Tests random read/write patterns typical of database workloads

[global]
name=gds-random-io-test
duration=60
filesize=8192
workers=64

# Random I/O typically uses smaller block sizes
block_sizes=4K,8K,16K,32K,64K,128K

test_types=rand-read,rand-write

mode=gds

verify=0
numa=-1

[job1]
gpu=0
device=/mnt/nvme0/gds_test

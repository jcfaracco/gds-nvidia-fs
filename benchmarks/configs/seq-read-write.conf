# Sequential Read/Write Benchmark Configuration
# Inspired by NVIDIA gdsio configuration format
#
# This configuration tests sequential I/O patterns with various block sizes

[global]
# Test name
name=gds-seq-io-test

# Test duration in seconds
duration=30

# File size in MB
filesize=4096

# Number of worker threads per GPU
workers=32

# Enable data verification (0=disabled, 1=enabled)
verify=0

# Block sizes to test (comma-separated or range format)
# Format: single (4K), list (4K,64K,1M), or range (4K:4M:4K)
block_sizes=4K,16K,64K,256K,1M,4M

# Test types: seq-read, seq-write, rand-read, rand-write
# Comma-separated list
test_types=seq-read,seq-write

# Transfer modes: gds, p2p, staged, all
mode=all

# NUMA node (auto-detect if -1)
numa=-1

[job1]
# GPU device ID
gpu=0

# Test device or directory
device=/mnt/nvme0/gds_test

# Per-job overrides (optional)
# workers=16
# filesize=2048

# Quick Test Configuration
# Fast sanity check for GDS functionality

[global]
name=gds-quick-test

# Short duration
duration=10

# Small file size
filesize=1024

# Moderate worker count
workers=16

# Limited block sizes
block_sizes=64K,1M,4M

# Basic test types
test_types=seq-read,seq-write

mode=gds

verify=1

numa=-1

[job1]
gpu=0
device=/mnt/nvme/gds_test

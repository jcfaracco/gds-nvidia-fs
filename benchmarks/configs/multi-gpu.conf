# Multi-GPU Benchmark Configuration
# Tests multiple GPUs accessing different storage devices concurrently

[global]
name=gds-multi-gpu-test
duration=45
filesize=4096
workers=32
block_sizes=1M,4M
test_types=seq-read,seq-write
mode=gds
verify=0

[job1]
gpu=0
numa=0
device=/mnt/nvme0/gds_test

[job2]
gpu=1
numa=0
device=/mnt/nvme1/gds_test

[job3]
gpu=2
numa=1
device=/mnt/nvme2/gds_test

[job4]
gpu=3
numa=1
device=/mnt/nvme3/gds_test

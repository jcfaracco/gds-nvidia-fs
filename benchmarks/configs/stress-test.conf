# Stress Test Configuration
# High-intensity test with many workers and long duration

[global]
name=gds-stress-test

# Extended duration for stress testing
duration=300

# Large file size
filesize=16384

# High worker count
workers=128

# Test all block sizes
block_sizes=4K:16M:4K

# Test all patterns
test_types=seq-read,seq-write,rand-read,rand-write

mode=gds

# Enable verification for stress test
verify=1

numa=-1

[job1]
gpu=0
device=/mnt/nvme0/gds_test
